[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flowguard"
version = "0.1.0"
description = "Hybrid ML network intrusion detection: supervised attack classification + anomaly detection on bidirectional flows."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hugo" }]
keywords = ["intrusion-detection", "nids", "machine-learning", "cybersecurity", "anomaly-detection", "cicids2017"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scapy>=2.5",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.37", "altair>=5.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.17.0"]

[project.scripts]
flowguard = "flowguard.cli:app"

[project.urls]
Repository = "https://github.com/hugo-kte/flowguard-nids"

[tool.hatch.build.targets.wheel]
packages = ["src/flowguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:scapy.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = [
    "N803", "N806",  # X/y naming is idiomatic in ML code
    "RUF001", "RUF002", "RUF003",  # intentional unicode (en dashes in labels, µs, σ)
]

[tool.coverage.run]
source = ["flowguard"]
omit = ["src/flowguard/dashboard/*"]
